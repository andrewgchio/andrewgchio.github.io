bio: |
  Andrew Chio is a Center for Nonlinear Studies (CNLS) Postdoctoral Research Fellow at Los Alamos National Laboratory, where he works with Dr. Russell Bent and Dr. Kaarthik Sundar in the T-5 Applied Mathematics and Plasma Physics Group. 
  His research leverages physics-based models and data-driven methods to explore and address questions of resilience in real-world critical infrastructure, such as buildings, water, and power systems. 
  He received his Ph.D. in Computer Science from the University of California, Irvine in 2026, where he was advised by Prof. Nalini Venkatasubramanian and was a member of the Distributed Systems Middleware Group and the Information Systems Group.
  Andrew is the recipient of several fellowships and awards, including the NSF CPS Rising Star Award (2025), the CPS-IoT Week PhD Forum Best Poster Award (2025), the UC National Laboratory In-Residence Graduate Fellowship (2022), the ARCS Foundation Scholarship (2022), and the Mark Weiser Best Paper Award at IEEE PerCom 2022.


