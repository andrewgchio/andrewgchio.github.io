# Navigation Links
#   To link a homepage widget, specify the URL as a hash `#` followed by the filename of the
  #     desired widget in your `content/home/` folder.
  #   The weight parameter defines the order that the links will appear in.

main:
  - name: Home
    url: ''
    weight: 10
  - name: Experience
    url: '/#experience'
    weight: 20
  - name: Awards
    url: '/#awards'
    weight: 25

  - name: Projects
    url: projects
    weight: 30
  - name: Publications
    url: publications
    weight: 50
  - name: News 
    url: '/#news'
    weight: 55
  # - name: Grants
  #   url: grants
  #   weight: 55
  # - name: Service
  #   url: service
  #   weight: 58
  - name: Contact
    url: '/#contact'
    weight: 60
  - name: CV
    # Absolute URL on purpose: the navbar and sidebar only add target="_blank"
    # to menu entries whose URL starts with "http", and a CV PDF should open in
    # a new tab rather than replace the site.
    url: https://andrewgchio.github.io/uploads/CV_AndrewChio_Aug2026.pdf
    weight: 70
